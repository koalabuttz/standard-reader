name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Desktop + shared frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  web:
    name: Browser / WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: nightly-2026-06-01
          components: rust-src
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: wasm32-unknown-unknown
      # Install a checked, prebuilt Trunk release rather than compiling this build tool in CI.
      - uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          tool: trunk@0.21.14
          fallback: none
      # The web crate's pure store/persistence/input tests run on the host; Trunk then covers the
      # wasm-only worker, DOM, OPFS, shared-memory linker, wasm-bindgen, and wasm-opt paths.
      - name: Test web shell logic
        run: cargo test --locked -p standard-reader-web
      - name: Build optimized web app
        working-directory: crates/standard-reader-web
        run: trunk build --release --locked
      - name: Verify deployable web package
        working-directory: crates/standard-reader-web
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          test "$(find dist -maxdepth 1 -name '*.js' | wc -l)" -ge 1
          test "$(find dist -maxdepth 1 -name '*.wasm' | wc -l)" -ge 1
          grep -q '/standard-reader/app/' dist/index.html
          grep -q 'Content-Security-Policy' dist/index.html
          grep -q "script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' 'sha256-" dist/index.html
          ! grep -q "script-src[^;]*'unsafe-inline'" dist/index.html
          node --check dist/sw.js
          node --check dist/*register-sw*.js
      - name: Upload web distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standard-reader-web
          path: crates/standard-reader-web/dist/
