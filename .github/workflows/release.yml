name: Release

# Builds the `sr` binary for the three main OSes plus the deployable browser bundle, and attaches
# every archive to the GitHub release on a `v*` tag. `workflow_dispatch` lets the matrix be dry-run
# (build + headless smoke, no release upload) before cutting the real tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl on Linux so the binaries run on any distro (no glibc version floor).
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}

      # musl needs a C toolchain for `ring`'s C/asm (and the static link). Pure-Rust otherwise.
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked -p standard-reader --target ${{ matrix.target }}

      # Headless smoke: `sr help` (arg parsing) + `sr cached` (exercises the cross-platform
      # config/cache dir resolution + redb open, no TTY needed). The interactive TUI can't run here.
      - name: Smoke
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/sr"
          [ "${{ runner.os }}" = "Windows" ] && bin="${bin}.exe"
          "$bin" help
          "$bin" cached

      - name: Package
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME:-dev}"
          name="sr-${tag}-${{ matrix.target }}"
          mkdir -p "$name"
          cp README.md LICENSE CHANGELOG.md "$name"/
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/sr.exe" "$name"/
            7z a "${name}.zip" "$name" >/dev/null
            echo "ASSET=${name}.zip" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/sr" "$name"/
            tar -czf "${name}.tar.gz" "$name"
            echo "ASSET=${name}.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  web:
    name: Browser / WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: nightly-2026-06-01
          components: rust-src
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: release-wasm32-unknown-unknown
      - uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          tool: trunk@0.21.14
          fallback: none

      - name: Build optimized web app
        working-directory: crates/standard-reader-web
        run: trunk build --release --locked

      - name: Verify deployable web package
        working-directory: crates/standard-reader-web
        run: |
          sed -i 's/[[:space:]]*$//' dist/index.html
          test -f dist/index.html
          test -f dist/sw.js
          test "$(find dist -maxdepth 1 -name '*.js' | wc -l)" -ge 1
          test "$(find dist -maxdepth 1 -name '*.wasm' | wc -l)" -ge 1
          grep -q '/standard-reader/app/' dist/index.html
          grep -q 'Content-Security-Policy' dist/index.html
          grep -q "script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' 'sha256-" dist/index.html
          ! grep -q "script-src[^;]*'unsafe-inline'" dist/index.html
          node --check dist/sw.js
          node --check dist/*register-sw*.js

      - name: Package
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME:-dev}"
          name="standard-reader-web-${tag}"
          mkdir -p "$name/app"
          cp -R crates/standard-reader-web/dist/. "$name/app/"
          cp client_metadata.json web_client_metadata.json "$name/"
          zip -qr "${name}.zip" "$name"
          echo "ASSET=${name}.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-wasm
          path: ${{ env.ASSET }}

  # Build jobs stay read-only. Only this small, action-minimal job receives permission to create
  # the release, after every platform artifact has completed successfully.
  publish:
    name: Publish release assets
    needs: [build, web]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - name: Extract release notes
        shell: bash
        run: |
          awk '/^## \[/{ if (seen) exit; if ($0 ~ /\['"${GITHUB_REF_NAME#v}"'\]/) seen=1 } seen' \
            CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md || echo "${GITHUB_REF_NAME}" > RELEASE_NOTES.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          tag: ${{ github.ref_name }}
        run: |
          gh release create "$tag" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag

  # After every archive is attached (a real tag), publish one SHA256SUMS for the release so
  # downloads can be verified. Uses `gh` against the release assets — no extra actions to version.
  checksums:
    name: SHA256SUMS
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate + attach SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          tag: ${{ github.ref_name }}
        run: |
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.tar.gz' --pattern '*.zip' --dir dist --clobber
          (cd dist && sha256sum *) > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$tag" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
