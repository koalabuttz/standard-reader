[workspace]
resolver = "3"
members = [
    "crates/standard-core",
    "crates/standard-frontend",
    "crates/standard-tui",
    "crates/standard-reader-web",
]
# Keep the web shell out of the default host build: bare `cargo build` / `cargo test` operate on
# these three desktop crates. `cargo test --workspace` also runs the web shell's host-testable pure
# logic; the actual wasm32 release build still goes through Trunk from that crate's directory.
default-members = [
    "crates/standard-core",
    "crates/standard-frontend",
    "crates/standard-tui",
]

[workspace.package]
edition = "2024"
# MSRV — edition 2024 needs 1.85, `is_multiple_of` needs 1.87, and let-chains (`if let … && …`)
# need 1.88. `cargo install` errors clearly on older toolchains.
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/koalabuttz/standard-reader"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Dev builds keep only line tables (file:line for panic backtraces), not full DWARF — we never
# run this under a debugger, and it ~halves the `target` dir + speeds up linking.
[profile.dev]
debug = "line-tables-only"
