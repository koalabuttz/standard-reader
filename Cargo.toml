[workspace]
resolver = "3"
members = ["crates/standard-core", "crates/standard-tui"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/koalabuttz/standard-reader"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Dev builds keep only line tables (file:line for panic backtraces), not full DWARF — we never
# run this under a debugger, and it ~halves the `target` dir + speeds up linking.
[profile.dev]
debug = "line-tables-only"
