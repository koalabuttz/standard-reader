[package]
name = "standard-core"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Kept at 0.x (no semver API promise) until a second frontend validates the Transport/Store seam;
# not published while it's pre-1.0.
publish = false
description = "UI- and I/O-agnostic engine for reading standard.site (atproto long-form) content."

[dependencies]
# Markdown (GreenGale bare strings + markpub). default-features off: we fold the
# event stream into RichDoc ourselves, so we need neither the HTML renderer nor the
# `getopts` CLI feature.
pulldown-cmark = { version = "0.13.4", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
# Small, dependency-free, lenient HTML parser for `org.wordpress.html`.
tl = "0.7.8"
