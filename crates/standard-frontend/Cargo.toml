[package]
name = "standard-frontend"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Platform-agnostic frontend (App state machine, ratatui UI, worker, seam traits) for standard-reader."

[dependencies]
standard-core = { path = "../standard-core" }
# Account/Prefs derive serde; Prefs (de)serializes via toml.
serde = { workspace = true }
toml = "0.8"
unicode-width = "0.2.2"
# The ratatui UI, but **without the crossterm backend** — crossterm doesn't compile to wasm, and the
# frontend stays platform-agnostic (input arrives via `crate::input`, the backend is the shell's).
# So `default-features = false` + the rest of the defaults (minus `crossterm`/`widget-calendar`),
# plus `unstable-rendered-line-info` for `Paragraph::line_count` (wrapped-text measurement). The
# desktop shell re-enables `crossterm` through its own ratatui dep.
ratatui = { version = "0.30", default-features = false, features = [
    "std",
    "all-widgets",
    "layout-cache",
    "underline-color",
    "macros",
    "unstable-rendered-line-info",
] }
# `DynamicImage` flows through `FromWorker`/`App`/`ImageSink`; the worker decodes blobs with the
# pure-Rust codecs (AVIF + anything unsupported falls back to the bsky CDN transcode, frontend-side).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
