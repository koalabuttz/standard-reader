[package]
name = "standard-reader-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Browser/WASM frontend shell for standard-reader (ratatui-in-the-browser via ratzilla)."

[dependencies]
# The engine (model types for canned data) + the platform-agnostic frontend (App / ui / worker /
# input / seam traits) this shell drives.
standard-core = { path = "../standard-core" }
standard-frontend = { path = "../standard-frontend" }
# ratatui-in-the-browser: owns the rAF render loop + DOM/canvas backends. Re-exports ratatui (and,
# being a wasm framework, pulls it crossterm-free — so this build never compiles crossterm).
ratzilla = "0.3"
# The overlay sink receives a decoded `DynamicImage` and PNG-encodes it for a Blob object URL.
image = { version = "0.25", default-features = false, features = ["png"] }
# Browser glue: window.open (URL-opener); a keydown guard (preventDefault the reader's keys); the
# synchronous-XHR transport; console logging; a readable panic message in the console.
wasm-bindgen = "0.2"
# Bridges OPFS's async Promises (getDirectory / read / write) into Rust `Future`s; `spawn_local`
# drives the persistence writes + the startup cache-load on the main thread (the worker thread
# blocks on `recv()` and can never await).
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# The OPFS cache (persist.rs / store.rs). `serde_json` is the same wire codec the desktop redb store
# uses, so the on-disk `index.json` / body / blob format is just the `model` types serialized.
serde = { workspace = true }
serde_json = { workspace = true }
web-sys = { version = "0.3", features = [
    "Window",
    "EventTarget",
    "KeyboardEvent",
    "XmlHttpRequest",
    "XmlHttpRequestResponseType",
    "console",
    # The native-`<img>` image overlay (sink.rs).
    "Document",
    "Element",
    "HtmlElement",
    "HtmlImageElement",
    "Node",
    "CssStyleDeclaration",
    "DomRect",
    "Blob",
    "Url",
    # OPFS persistence (persist.rs): navigator.storage.getDirectory() → dir/file handles → writes.
    "Navigator",
    "StorageManager",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemWritableFileStream",
    "WritableStream",
    "File",
] }
console_error_panic_hook = "0.1"
