[package]
name = "standard-reader-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Browser/WASM frontend shell for standard-reader (ratatui-in-the-browser via ratzilla)."

[dependencies]
# The engine (model types for canned data) + the platform-agnostic frontend (App / ui / worker /
# input / seam traits) this shell drives.
standard-core = { path = "../standard-core" }
standard-frontend = { path = "../standard-frontend" }
# ratatui-in-the-browser: owns the rAF render loop + DOM/canvas backends. Re-exports ratatui (and,
# being a wasm framework, pulls it crossterm-free — so this build never compiles crossterm).
ratzilla = "0.3"
# The overlay sink receives a decoded `DynamicImage` and PNG-encodes it for a Blob object URL.
image = { version = "0.25", default-features = false, features = ["png"] }
# Browser glue: window.open (URL-opener); a keydown guard (preventDefault the reader's keys); the
# synchronous-XHR transport; console logging; a readable panic message in the console.
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "EventTarget",
    "KeyboardEvent",
    "XmlHttpRequest",
    "XmlHttpRequestResponseType",
    "console",
    # The native-`<img>` image overlay (sink.rs).
    "Document",
    "Element",
    "HtmlElement",
    "HtmlImageElement",
    "Node",
    "CssStyleDeclaration",
    "DomRect",
    "Blob",
    "Url",
] }
console_error_panic_hook = "0.1"
