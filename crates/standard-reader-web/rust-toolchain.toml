# wasm threads (wasm_thread) need atomics, which require a custom-built std — nightly + rust-src.
# This file is directory-scoped so cargo/trunk run here uses the shared pinned nightly even if the
# host's rustup default changes.
[toolchain]
# Pin the known-good nightly: wasm atomics rely on unstable build-std/linker behavior, so a moving
# nightly can break the browser build without any repository change.
channel = "nightly-2026-06-01"
components = ["rust-src"]
targets = ["wasm32-unknown-unknown"]
