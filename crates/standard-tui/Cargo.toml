[package]
name = "standard-reader"
version = "1.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A TUI reader for standard.site (long-form on the AT Protocol)."

[[bin]]
name = "sr"
path = "src/main.rs"

[dependencies]
standard-core = { path = "../standard-core" }
# The platform-agnostic frontend (App, UI, worker, seam traits) this binary is the desktop shell
# for: it supplies the concrete `Transport` / `FrontendStore` / `AuthProvider` / `ImageSink` impls.
standard-frontend = { path = "../standard-frontend" }
# Synchronous HTTP for the `Transport` impl. rustls (pure-Rust TLS); `blocking`
# matches the core's sync Transport. One HTTP stack, later shared with async OAuth.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
# Offline cache: pure-Rust embedded KV behind the core's `Store` trait.
redb = "4"
# (De)serialize the model types (which derive serde) into cache values.
serde = "1"
serde_json = "1"
# The terminal backend + `Frame` (re-exports crossterm for events). The reader's wrapped-text
# measurement (`unstable-rendered-line-info`) lives in `standard-frontend`; the shell only renders
# and reads input, so it needs default features only.
ratatui = "0.30"
# Terminal images (iTerm2 protocol on this hterm box; halfblocks fallback) + decoding.
# default-features off drops the `chafa` C-lib protocol and image's all-formats default;
# iTerm2/kitty/halfblocks are always available. `crossterm` matches ratatui's backend.
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# Open a post's web URL in the user's browser (xdg-open / open / start).
open = "5"
# OAuth sign-in + writes (DPoP, browser loopback). `default-client` is off because it
# pulls `reqwest/default-tls` (openssl, a C dep); we supply a rustls `HttpClient` instead,
# reusing reqwest's async side. `atrium-api` drops its bluesky namespaces — we only touch
# `com.atproto.repo.*` (subscription records) + the `Agent`. async/tokio stays frontend-only.
atrium-oauth = { version = "0.1", default-features = false }
atrium-api = { version = "0.25", default-features = false, features = ["agent"] }
atrium-identity = "0.1"
atrium-xrpc = "0.12"
# The `Store<K,V>` trait that atrium's `SessionStore` extends — needed to back the OAuth
# session with our own 0600 file instead of atrium's in-memory default.
atrium-common = "0.1"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "sync"] }

# OS keyring for the OAuth session (DPoP key + tokens). keyring v3 has no default features — pick
# a backend per OS. macOS Keychain + Windows Credential Manager are pure-Rust native stores, on by
# default. Linux Secret Service is opt-in via `--features secret-service` because it pulls
# `dbus-secret-service` → libdbus (a C dep); default/prebuilt Linux builds use the 0600 file
# fallback instead, so nothing we ship links a C library.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, optional = true, features = [
    "sync-secret-service",
    "crypto-rust",
] }

[features]
secret-service = ["dep:keyring"]
