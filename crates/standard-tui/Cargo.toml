[package]
name = "standard-reader"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "A lean, polished TUI reader for standard.site (long-form on the AT Protocol)."

[[bin]]
name = "sr"
path = "src/main.rs"

[dependencies]
standard-core = { path = "../standard-core" }
# Synchronous HTTP for the `Transport` impl. rustls (pure-Rust TLS); `blocking`
# matches the core's sync Transport. One HTTP stack, later shared with async OAuth.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
# Offline cache: pure-Rust embedded KV behind the core's `Store` trait.
redb = "4"
# (De)serialize the model types (which derive serde) into cache values.
serde = "1"
serde_json = "1"
# The terminal UI (re-exports crossterm for events/backend). The unstable feature
# gives Paragraph::line_count, used to measure wrapped text height for the block-flow
# reader (so layout matches ratatui's own wrapping exactly).
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
# Terminal images (iTerm2 protocol on this hterm box; halfblocks fallback) + decoding.
# default-features off drops the `chafa` C-lib protocol and image's all-formats default;
# iTerm2/kitty/halfblocks are always available. `crossterm` matches ratatui's backend.
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# Remaining frontend deps (atrium-oauth) land as the TUI grows.
